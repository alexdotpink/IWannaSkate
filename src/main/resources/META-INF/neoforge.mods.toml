modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/AlexModGuy/IWannaSkate/issues"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="iwannaskate.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[modproperties.${mod_id}]
catalogueItemIcon="iwannaskate:skateboard_wheels"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="citadel"
type="required"
versionRange="[2.7.0,)"
ordering="AFTER"
side="BOTH"
